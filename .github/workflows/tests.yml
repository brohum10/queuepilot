name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python artifacts.py --verify evidence/queuepilot-evidence.zip
      - run: python -m unittest -v
      - name: Reproduce both model fits with untouched official test evaluation
        run: python train.py --output evidence/rebuilt/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queuepilot-python-${{ matrix.python }}
          path: evidence/rebuilt/ci/evidence/
          retention-days: 14
